# Render Blueprint（Render完結構成）。
# Render ダッシュボード → Blueprints → このリポジトリを指定すると、
# Webサービス・Postgres・日次Cron をまとめて作成できる。
#
# ⚠️ Cron Job は無料プラン不可（`free not a valid plan for service type cron`）。
#    本構成では有料tier（plan: starter）で作成する。※有料プラン契約が前提。
#    ＝Render内蔵cronで完結（外部cron不要）。
#
# その他の注意:
#   - free Web サービスは無操作で一定時間後スリープ（次アクセスでコールドスタート）。
#   - ⚠️ Render の free Postgres は作成から約90日で削除される点に注意（要確認）。

databases:
  - name: drugdata-now-db
    plan: free
    databaseName: drugdata
    user: drugdata

# CRON_SECRET / ADMIN_TOKEN は web と cron で同じ値を共有する必要があるため env グループにまとめる。
envVarGroups:
  - name: copilot-secrets
    envVars:
      - key: CRON_SECRET
        generateValue: true
      - key: ADMIN_TOKEN
        generateValue: true

services:
  - type: web
    name: drugdata-now
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - fromGroup: copilot-secrets
      - key: DATABASE_URL
        fromDatabase:
          name: drugdata-now-db
          property: connectionString

  # 日次の自動更新（Render Cron Job）。有料tierで作成する。
  # web サービスの /api/cron/refresh を Bearer 認証付きで叩くだけ（取り込み本体は web 側で実行）。
  - type: cron
    name: drugdata-now-daily-refresh
    runtime: node
    plan: starter # ⚠️ free は不可。starter 以上の有料tierが必要（実プラン名はRenderの表示で要確認）
    schedule: "0 0 * * *" # 毎日1回（UTC 0時 = 日本時間9時）
    buildCommand: npm install
    startCommand: >-
      curl -fsS -H "Authorization: Bearer $CRON_SECRET"
      "https://$APP_HOST/api/cron/refresh?source=official"
    envVars:
      - fromGroup: copilot-secrets
      - key: APP_HOST
        fromService:
          name: drugdata-now
          type: web
          property: host

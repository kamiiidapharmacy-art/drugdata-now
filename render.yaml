# Render Blueprint（Render完結構成）。
# Render ダッシュボード → Blueprints → このリポジトリを指定すると、
# Webサービス・Postgres をまとめて作成できる。
#
# ⚠️ Render の Cron Job は無料プランで作成不可（`free not a valid plan for service type cron`）のため、
#    日次更新は Render の cron サービスではなく外部の無料 cron で行う。
#    外部 cron（例: cron-job.org）から
#      https://<あなたのRender URL>/api/cron/refresh?source=official
#    を 1日1回・ヘッダ "Authorization: Bearer <CRON_SECRET>" 付きで叩く（README参照）。
#
# その他の注意:
#   - free Web サービスは無操作で一定時間後スリープ（次アクセスでコールドスタート）。
#   - ⚠️ Render の free Postgres は作成から約90日で削除される点に注意（要確認）。

databases:
  - name: drugdata-now-db
    plan: free
    databaseName: drugdata
    user: drugdata

# CRON_SECRET / ADMIN_TOKEN を env グループにまとめる。
# CRON_SECRET は外部 cron からの呼び出し検証に使う（Authorization: Bearer の値）。
envVarGroups:
  - name: copilot-secrets
    envVars:
      - key: CRON_SECRET
        generateValue: true
      - key: ADMIN_TOKEN
        generateValue: true

services:
  - type: web
    name: drugdata-now
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - fromGroup: copilot-secrets
      - key: DATABASE_URL
        fromDatabase:
          name: drugdata-now-db
          property: connectionString

# 日次の自動更新は外部 cron（cron-job.org 等）から実施する。
#   URL  : https://<RenderのWeb URL>/api/cron/refresh?source=official
#   Header: Authorization: Bearer <CRON_SECRET の値>
#   頻度 : 1日1回（例: 日本時間9時 = UTC 0時）
